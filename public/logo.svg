<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003B73"/>
      <stop offset="100%" stop-color="#001B44"/>
    </linearGradient>

    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#E6A100"/>
      <stop offset="100%" stop-color="#B37400"/>
    </linearGradient>

    <!-- Tassel Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background (Optional for contrast, set to transparent by default) -->
  <rect width="512" height="512" fill="none"/>

  <g transform="translate(0, 10)">
    <!-- GRADUATION CAP -->
    <!-- Cap Top Diamond -->
    <path d="M 256 40 L 480 140 L 256 210 L 32 140 Z" fill="url(#blueGrad)"/>
    <path d="M 256 40 L 480 140 L 256 160 L 32 140 Z" fill="#0056A6" opacity="0.3"/>

    <!-- Cap Skull Base -->
    <path d="M 160 180 L 160 220 C 160 250, 352 250, 352 220 L 352 180 Z" fill="url(#blueGrad)"/>

    <!-- Tassel String & Knob -->
    <path d="M 110 162 C 90 200, 72 230, 72 260" stroke="#002855" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="110" cy="162" r="7" fill="#001B44"/>
    <!-- Tassel Fringe -->
    <path d="M 72 260 C 62 280, 58 310, 52 330 C 72 330, 80 320, 82 260 Z" fill="url(#blueGrad)" filter="url(#shadow)"/>

    <!-- LOGO MARK: INTEGRATED 'iS' -->

    <!-- Blue 'i' Dot -->
    <circle cx="178" cy="385" r="22" fill="url(#blueGrad)"/>

    <!-- Main Blue 'S' Swash & 'i' Body -->
    <path d="M 162 480 
             C 156 420, 156 410, 178 410 
             C 210 410, 240 450, 290 450 
             C 340 450, 370 420, 370 370 
             C 370 300, 270 290, 220 260 
             C 180 236, 170 200, 190 155 
             C 210 210, 270 230, 320 220 
             C 250 200, 200 170, 220 120 
             C 150 170, 120 250, 160 320 
             C 190 370, 260 360, 280 390 
             C 295 412, 275 430, 240 430 
             C 190 430, 165 490, 162 480 Z" 
          fill="url(#blueGrad)"/>

    <!-- Gold Overlay 'S' Curve -->
    <path d="M 220 130 
             C 310 120, 410 180, 380 270 
             C 355 345, 270 330, 240 370 
             C 210 410, 250 480, 340 480 
             C 420 460, 450 370, 420 300 
             C 390 230, 320 180, 220 130 Z" 
          fill="url(#goldGrad)"/>
  </g>
</svg>
